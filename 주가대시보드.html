  .small-charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
  .small-charts .panel { margin-bottom:0; }
  .note { font-size:12px; color:var(--sub); margin-top:8px; }

<script>
const D = window.DASH_DATA;
const COLORS = { "005930":"#1f77b4", "000660":"#d62728", "011200":"#2ca02c", "137400":"#9467bd", "066590":"#ff7f0e" };

// 주간 날짜 배열 재구성: firstDate부터 7일 간격 (n-1)개 + 마지막은 lastDate
function buildDates() {
  const dates = [];
  const d0 = new Date(D.firstDate + "T00:00:00");
  for (let i = 0; i < D.n - 1; i++) {
    const d = new Date(d0.getTime() + i * 7 * 86400000);
    dates.push(d.toISOString().slice(0, 10));
  }
  dates.push(D.lastDate);
  return dates;
}
const dates = buildDates();

document.getElementById("updated").textContent =
  "최종 업데이트: " + D.updated + " · 주간 종가 기준 3년 (" + D.firstDate + " ~ " + D.lastDate + ") · 매일 8시·11시·16시 자동 갱신";

// 카드
const fmt = n => n.toLocaleString("ko-KR");
const cardsEl = document.getElementById("cards");
for (const [code, s] of Object.entries(D.stocks)) {
  const diff = s.price - s.prev;
  const pct = (diff / s.prev * 100).toFixed(2);
  const cls = diff >= 0 ? "up" : "down";
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "−";
  cardsEl.insertAdjacentHTML("beforeend", `
    <div class="card" style="border-top:4px solid ${COLORS[code]};cursor:pointer" onclick="if(event.target.tagName!=='A')location.href='${s.file}'">
      <span class="name">${s.name}</span><span class="code">${code} · ${s.market}</span>
      <div class="price">${fmt(s.price)}원</div>
      <div class="chg ${cls}">${arrow} ${fmt(Math.abs(diff))} (${pct}%) <span style="font-weight:normal;color:var(--sub)">전일 대비</span></div>
      <div class="meta">52주 최고 ${fmt(s.h52)} / 최저 ${fmt(s.l52)}<br>거래량 ${fmt(s.vol)}</div>
      <a href="${s.file}">상세 보기 →</a> &nbsp;
      <a href="https://finance.naver.com/item/main.naver?code=${code}" target="_blank">네이버 금융 →</a>
    </div>`);
}

// 메인 비교 차트 (상대수익률, 2025-06부터)
const CMP_FROM = "2025-06-01";
let cmpStart = dates.findIndex(d => d >= CMP_FROM);
if (cmpStart < 0) cmpStart = 0;
const cmpDates = dates.slice(cmpStart);
new Chart(document.getElementById("mainChart"), {
  type: "line",
  data: {
    labels: cmpDates,
    datasets: Object.entries(D.stocks).map(([code, s]) => {
      const seg = s.closes.slice(cmpStart);
      const base = seg.find(v => v != null);
      return { label: s.name, data: seg.map(v => v == null ? null : +(v / base * 100).toFixed(1)),
               borderColor: COLORS[code], backgroundColor: COLORS[code], borderWidth: 2, pointRadius: 0, tension: .15, spanGaps: true };
    })
  },
  options: {
    responsive: true, interaction: { mode: "index", intersect: false },
    plugins: { legend: { position: "top" }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y} (기준=100)` } } },
    scales: { x: { ticks: { maxTicksLimit: 13 } }, y: { title: { display: true, text: "2025-06 기준=100" } } }
  }
});

// 종목별 개별 차트
const sc = document.getElementById("smallCharts");
for (const [code, s] of Object.entries(D.stocks)) {
  const id = "c" + code;
  sc.insertAdjacentHTML("beforeend", `<div class="panel" style="cursor:pointer" onclick="location.href='${s.file}'" title="${s.name} 상세 페이지로 이동"><h2>${s.name} <span style="color:var(--sub);font-size:12px">${code} · 클릭 시 상세 보기</span></h2><canvas id="${id}"></canvas></div>`);
  new Chart(document.getElementById(id), {
    type: "line",
    data: { labels: cmpDates, datasets: [{ data: s.closes.slice(cmpStart), borderColor: COLORS[code], borderWidth: 1.8, pointRadius: 0, tension: .15, spanGaps: true,
            fill: true, backgroundColor: COLORS[code] + "18" }] },
    options: { responsive: true, plugins: { legend: { display: false } },
      scales: { x: { ticks: { maxTicksLimit: 7 } }, y: { ticks: { callback: v => v.toLocaleString("ko-KR") } } },
      interaction: { mode: "index", intersect: false } }
  });
}
</script>
